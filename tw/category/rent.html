(function () {
  var STEPS = [100, 112, 125, 90];          // 標準 → 大 → 特大 → 小 → 循環
  var LABEL = { 100: "標準", 112: "大", 125: "特大", 90: "小" };
  var root = document.documentElement;
  var cur = 100;
  try { cur = parseInt(localStorage.getItem("fs"), 10) || 100; } catch (e) {}
  if (STEPS.indexOf(cur) < 0) cur = 100;

  function apply(pct) {
    root.style.fontSize = (16 * pct / 100) + "px";
    try { localStorage.setItem("fs", String(pct)); } catch (e) {}
  }

  var btn = document.createElement("button");
  btn.type = "button";
  btn.className = "fsr";
  function label() {
    btn.textContent = "字 " + (LABEL[cur] || cur + "%");
    btn.setAttribute("aria-label", "文字大小：" + (LABEL[cur] || cur + "%") + "，點擊切換");
    btn.title = "點擊切換文字大小";
  }
  label();
  btn.addEventListener("click", function () {
    cur = STEPS[(STEPS.indexOf(cur) + 1) % STEPS.length];
    apply(cur); label();
  });

  function mount() {
    if (document.querySelector(".fsr")) return;
    // 文字大小是整頁偏好，所以每頁只放一個，放在站點導航裏（不是每篇一個）
    var host = document.querySelector("nav") || document.querySelector(".postnav");
    if (!host) {
      var back = document.querySelector(".back") || document.querySelector("h1");
      if (back) { back.insertAdjacentElement("afterend", btn); return; }
      return;
    }
    host.appendChild(btn);
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", mount);
  } else { mount(); }
})();
</script><!--fs:end-->
<!--th:start--><script>

<!--tts:start--><script>
(function () {
  if (!("speechSynthesis" in window)) return;            // 老瀏覽器直接安靜退出

  // zh-Hans / zh-Hant 映射到語音引擎認的 BCP-47 標籤
  var pageLang = (document.documentElement.lang || "zh-Hans");
  var lang = pageLang.indexOf("Hant") >= 0 ? "zh-TW" : "zh-CN";

  function pickVoice() {
    var wants = lang.toLowerCase();
    var vs = window.speechSynthesis.getVoices() || [];
    for (var i = 0; i < vs.length; i++) {
      var l = (vs[i].lang || "").replace("_", "-").toLowerCase();
      if (l === wants) return vs[i];
    }
    for (var j = 0; j < vs.length; j++) {
      var l2 = (vs[j].lang || "").replace("_", "-").toLowerCase();
      if (l2.indexOf(wants.split("-")[0]) === 0) return vs[j];
    }
    return null;
  }

  // 只念**標題 + 正文**：不念頁頭（站名/副標題）、meta 行（日期·欄目·字數）、
  // 欄目條、免責聲明、評論。做法是"白名單取元素"，而不是"整塊減去黑名單"——
  // 後者會把頁頭之類的東西順帶念出來。
  var SKIP = ".comments, .notice, .postnav, .catnav, .c-link, .art-meta,"
           + " .site-tools, .fsr, .speak, .top, .foot, .read-progress, .back-top,"
           + " script, style, nav";

  function clean(el) {
    return (el.innerText || el.textContent || "").replace(/\s+/g, " ").trim();
  }

  function textOf(region) {
    var out = [];
    // 按偏好順序找標題：不能用一次性 querySelector("h1, a")——它返回**文檔順序**裏
    // 第一個命中的元素，單篇頁裏 <a class="back">← 回首頁</a> 排在 h1 前面，會被當成標題。
    var title = region.querySelector("h1.art") || region.querySelector("h1, h2, h3, .ttl")
             || region.querySelector("a");
    var titleText = "";
    if (title && !(title.closest && title.closest(SKIP))) {
      var tc = title.cloneNode(true);
      Array.prototype.forEach.call(tc.querySelectorAll(".chip, .cnt"), function (n) {
        n.parentNode && n.parentNode.removeChild(n);
      });
      titleText = clean(tc);
      if (titleText) out.push(titleText);
    }
    var nodes = region.querySelectorAll("h2, h3, p");
    for (var i = 0; i < nodes.length; i++) {
      var n = nodes[i];
      if (n === title) continue;
      if (n.closest && n.closest(SKIP)) continue;
      var t = clean(n);
      if (t && t !== titleText) out.push(t);
    }
    if (!out.length) {                       // 兜底：沒有段落的結構（如純列表項）
      var c = region.cloneNode(true);
      Array.prototype.forEach.call(c.querySelectorAll(SKIP + ", .speak"), function (n) {
        n.parentNode && n.parentNode.removeChild(n);
      });
      var t2 = clean(c);
      if (t2) out.push(t2);
    }
    return out.join("\n");
  }

  // 長文切成小段排隊，避免部分瀏覽器對單次朗讀有長度/時長限制。
  // 不用 lookbehind 正則（(?<=...)）：老版本 Safari 解析階段就報錯，會讓整段腳本失效。
  function chunk(text) {
    var out = [], buf = "";
    var parts = text.split(/([。！？!?；;\n])/);
    for (var i = 0; i < parts.length; i += 2) {
      var piece = (parts[i] || "") + (parts[i + 1] || "");
      if (!piece.trim()) continue;
      if ((buf + piece).length > 220 && buf) { out.push(buf); buf = ""; }
      buf += piece;
    }
    if (buf.trim()) out.push(buf);
    return out;
  }

  var current = null;      // 正在朗讀的按鈕

  function stop() {
    window.speechSynthesis.cancel();
    if (current) { current.textContent = "🔊 朗讀"; current = null; }
  }

  function speak(btn, region) {
    stop();
    var text = textOf(region);
    if (text.length < 8) return;   // 列表頁只有標題，門檻別定太高
    var voice = pickVoice();
    var pieces = chunk(text);
    pieces.forEach(function (piece, i) {
      var u = new SpeechSynthesisUtterance(piece);
      u.lang = lang;
      if (voice) u.voice = voice;
      u.rate = 0.95; u.pitch = 1;
      if (i === pieces.length - 1) {
        u.onend = function () { if (current === btn) { btn.textContent = "🔊 朗讀"; current = null; } };
      }
      window.speechSynthesis.speak(u);
    });
    btn.textContent = "⏹ 停止";
    current = btn;
  }

  function makeButton(region, host) {
    var btn = document.createElement("button");
    btn.className = "speak";
    btn.type = "button";
    btn.textContent = "🔊 朗讀";
    btn.setAttribute("aria-label", "朗讀本文");
    btn.addEventListener("click", function () {
      if (current === btn) { stop(); } else { speak(btn, region); }
    });
    if (host) host.appendChild(btn);     // host 爲空時由調用方決定插哪兒
    return btn;
  }

  function mount() {
    // 首頁是 <article>（全文直鋪），往期/欄目頁是 <li>（只有標題）——兩種都要能念，
    // 而且按鈕一律挨着標題放：之前掛在文章末尾的「讀者評論」那一行，
    // 讀者得先讀完一整篇纔看得見按鈕。
    // 只掛到**有正文的條目**：首頁卡片是 <article>（全文直鋪），單篇頁走下面的兜底分支。
    // 兩條教訓疊出來的規則：
    //   ① 用戶明確要求"朗讀鍵只有在正文裏面纔有" —— 列表頁(欄目/往期/常讀)每行只有標題，
    //      34 行就是 34 個按鈕，念出來還是空氣；
    //   ② 早前用 querySelectorAll("article, li")，把導航、目錄、postnav 也當成了條目，
    //      頁面上出現"今日原創 [朗讀] 往期原創 [朗讀]"這種莫名其妙的東西。
    // 錯誤頁（404）聲明瞭 noindex，就別在上面掛朗讀按鈕。
    // 這裏用"取屬性再查字符串"，不用 [content~="noindex"] 這種屬性詞選擇器 ——
    // 花式選擇器一旦不被支持就是整段腳本拋錯（朗讀按鈕全站消失），不值這個風險。
    var rb = document.querySelector('meta[name="robots"]');
    if (rb && (rb.getAttribute("content") || "").indexOf("noindex") >= 0) return;
    var items = document.querySelectorAll("article[data-srow]");
    if (items.length) {
      Array.prototype.forEach.call(items, function (it) {
        if (it.querySelector(".speak")) return;
        var title = it.querySelector("h1, h2, h3, .ttl, a");
        var btn = makeButton(it, null);
        if (title) { title.insertAdjacentElement("afterend", btn); }
        else { it.appendChild(btn); }
      });
      return;
    }
    // 單篇頁：沒有條目元素，整塊 .wrap 當朗讀區域，按鈕放到標題旁。
    // 判據是生成器寫在 <body> 上的 data-page —— 不要從 DOM 裏認：
    // 欄目頁的標題也是 h1.art（撞上了），.c-body 又是評論的正文容器（也撞上了）。
    if ((document.body.getAttribute("data-page") || "") !== "post") return;
    var wrap = document.querySelector(".wrap");
    if (!wrap || wrap.querySelector(".speak")) return;
    // 按鈕插在標題**後面作爲兄弟節點**（insertAdjacentElement 是"之後"，不是"裏面"）：
    // 早前用 appendChild(host) 時按鈕成了 h1 的子節點，標題文字裏就混進了「🔊 朗讀」，
    // 被念出來變成"AI治理加速…🔊 朗讀"。另外單篇頁的 .postnav 在 .wrap 外面，別指望它。
    var h1 = wrap.querySelector("h1.art") || wrap.querySelector("h1");
    var btn = makeButton(wrap, null);
    if (h1) { h1.insertAdjacentElement("afterend", btn); }
    else if (wrap.firstElementChild) { wrap.insertBefore(btn, wrap.firstElementChild); }
    else { wrap.appendChild(btn); }
  }

  window.addEventListener("pagehide", stop);
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", mount);
  } else { mount(); }
})();
</script><!--tts:end-->
